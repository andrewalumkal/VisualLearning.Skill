<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Kafka zoom explorer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@100..900&display=swap">
<style>
  /* Theme tokens: neutral grays, Inter, soft shadows on controls only.
     Every color is a variable set three times: light (default), dark from the system, and dark forced
     with data-theme="dark". Data colors come from RAMPS in the script and follow the same three cases. */
  :root {
    --bg: oklch(.97 0 0); --surface: oklch(.994 0 0); --surface1: oklch(0 0 0 / .04); --sunk: oklch(0 0 0 / .04);
    --text: oklch(.097 0 0); --text2: oklch(.097 0 0 / .6); --muted: oklch(.097 0 0 / .42);
    --border: oklch(0 0 0 / .06); --border-strong: oklch(0 0 0 / .12); --border-emph: oklch(0 0 0 / .3);
    --accent: oklch(.097 0 0); --on-accent: oklch(.994 0 0); --track: oklch(0 0 0 / .08);
    --box: oklch(.97 0 0);
    --shadow-m: 0 4px 6px -2px oklch(0 0 0 / .025), 0 2px 2px -2px oklch(0 0 0 / .05);
    --shadow-xl: 0 8px 16px -4px oklch(0 0 0 / .08), 0 16px 32px -6px oklch(0 0 0 / .12);
    --radius: 10px; color-scheme: light;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: oklch(.145 0 0); --surface: oklch(.205 0 0); --surface1: oklch(.994 0 0 / .04); --sunk: oklch(.994 0 0 / .05);
      --text: oklch(.985 0 0); --text2: oklch(.985 0 0 / .6); --muted: oklch(.985 0 0 / .42);
      --border: oklch(.994 0 0 / .06); --border-strong: oklch(.994 0 0 / .12); --border-emph: oklch(.994 0 0 / .4);
      --accent: oklch(.994 0 0); --on-accent: oklch(.097 0 0); --track: oklch(.994 0 0 / .1);
      --box: oklch(.269 0 0);
      --shadow-m: 0 4px 6px -2px oklch(0 0 0 / .08), 0 2px 2px -2px oklch(0 0 0 / .12);
      --shadow-xl: 0 8px 16px -4px oklch(0 0 0 / .16), 0 16px 32px -6px oklch(0 0 0 / .2); color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: oklch(.145 0 0); --surface: oklch(.205 0 0); --surface1: oklch(.994 0 0 / .04); --sunk: oklch(.994 0 0 / .05);
    --text: oklch(.985 0 0); --text2: oklch(.985 0 0 / .6); --muted: oklch(.985 0 0 / .42);
    --border: oklch(.994 0 0 / .06); --border-strong: oklch(.994 0 0 / .12); --border-emph: oklch(.994 0 0 / .4);
    --accent: oklch(.994 0 0); --on-accent: oklch(.097 0 0); --track: oklch(.994 0 0 / .1);
    --box: oklch(.269 0 0);
    --shadow-m: 0 4px 6px -2px oklch(0 0 0 / .08), 0 2px 2px -2px oklch(0 0 0 / .12);
    --shadow-xl: 0 8px 16px -4px oklch(0 0 0 / .16), 0 16px 32px -6px oklch(0 0 0 / .2); color-scheme: dark;
  }
  body { margin: 0; background: var(--bg); color: var(--text); font: 400 16px/1.5 "Inter", system-ui, sans-serif; letter-spacing: -.01em; }
  main { position: relative; max-width: 760px; margin: 0 auto; padding: 28px 16px; }
  h1 { font-size: 24px; font-weight: 600; line-height: 1.1; margin: 0 0 8px; }
  .sub { color: var(--text2); font-size: 14px; margin: 0 0 16px; }
  .bar { display: flex; align-items: center; gap: 8px; min-height: 36px; flex-wrap: wrap; }
  #crumbs { display: flex; align-items: center; gap: 2px; flex-wrap: wrap; font-size: 14px; }
  .crumb { border: none; background: none; box-shadow: none; padding: 2px 4px; color: var(--text2); cursor: pointer; font: inherit; }
  .crumb:hover { background: none; color: var(--text); text-decoration: underline; text-underline-offset: 3px; }
  .here { padding: 2px 4px; font-weight: 560; }
  .sep { color: var(--muted); }
  button { font: inherit; font-size: 14px; font-weight: 500; line-height: 20px; color: var(--text); background: var(--surface); border: 1px solid var(--border-strong);
           border-radius: var(--radius); padding: 5px 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: var(--shadow-m); }
  button:hover { background: var(--sunk); box-shadow: none; }
  button:active { transform: scale(.98); }
  .spacer { margin-left: auto; }
  #pause { background: var(--accent); color: var(--on-accent); border-color: transparent; }
  #pause:hover { opacity: .8; }
  #views { display: inline-flex; gap: 4px; padding: 4px; min-height: 0; background: var(--sunk); border-radius: 12px; margin-bottom: 8px; }
  .vbtn { border-color: transparent; background: transparent; box-shadow: none; color: var(--text2); }
  .vbtn:hover { color: var(--text); background: transparent; }
  .vbtn.active { background: var(--surface); color: var(--text); border-color: var(--border); box-shadow: var(--shadow-m); }
  .sources { font-size: 14px; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 4px 20px 16px; margin-top: 20px; }
  .sources h2 { font-size: 16px; font-weight: 600; margin: 16px 0 6px; }
  .sources p, .sources ol { font-size: 14px; color: var(--text2); margin: 0; }
  .sources ol { padding-left: 20px; }
  .sources li { margin: 4px 0; }
  .sources a { color: var(--text); text-decoration: underline; text-decoration-color: var(--border-emph); text-underline-offset: 3px; }
  svg#zv { display: block; width: 100%; height: auto; background: var(--surface); border: 1px solid var(--border); border-radius: 16px; margin: 8px 0; touch-action: manipulation; }
  #controls { display: flex; flex-wrap: wrap; gap: 10px 18px; align-items: center; font-size: 14px; color: var(--text2); min-height: 36px;
              background: var(--surface); border: 1px solid var(--border); border-radius: 14px; padding: 10px 14px; box-sizing: border-box; }
  #controls button { padding: 3px 10px; }
  .grp { display: inline-flex; align-items: center; gap: 8px; }
  .val { color: var(--text); font-weight: 560; min-width: 28px; text-align: center; font-variant-numeric: tabular-nums; }
  .sw { width: 10px; height: 10px; border-radius: 3px; display: inline-block; box-sizing: border-box; border: 1px solid transparent; }
  .hint { font-size: 13px; color: var(--muted); margin-top: 12px; }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 120px; height: 6px; border-radius: 999px; background: var(--track); outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-emph); box-shadow: var(--shadow-m); cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 16px; height: 16px; border-radius: 50%; background: var(--surface); border: 1px solid var(--border-emph); box-shadow: var(--shadow-m); cursor: pointer; }
  input[type=range]:focus-visible { box-shadow: 0 0 0 3px var(--border-strong); }
  #zv text { font-family: inherit; letter-spacing: -.01em; }
  .t, .th { font-size: 14px; fill: var(--text); }
  .th { font-weight: 560; }
  .ts { font-size: 12px; fill: var(--text2); }
  .box { fill: var(--box); stroke: var(--border-strong); }
  .arr { stroke: var(--muted); stroke-width: 1.2; fill: none; }
  .leader { stroke: var(--muted); stroke-width: .8; stroke-dasharray: 3 3; fill: none; }
  .node { cursor: pointer; }
  .node:hover { opacity: .85; }
  /* Drill-in affordance: the ONE standard marker for "click to zoom in". Blue plus badge + slow pulsing ring. */
  :root { --zoom: #378ADD; --zoom-bg: #E6F1FB; }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) { --zoom: #85B7EB; --zoom-bg: #0C447C; } }
  :root[data-theme="dark"] { --zoom: #85B7EB; --zoom-bg: #0C447C; }
  .zb { fill: var(--zoom-bg); stroke: var(--zoom); stroke-width: 1.2; }
  .zb-plus { stroke: var(--zoom); stroke-width: 1.8; stroke-linecap: round; fill: none; }
  .zb-ring { fill: none; stroke: var(--zoom); stroke-width: 1.5; transform-box: fill-box; transform-origin: center; animation: zpulse 2.4s ease-out infinite; }
  @keyframes zpulse { 0% { transform: scale(1); opacity: .8; } 70%, 100% { transform: scale(2.2); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .zb-ring { animation: none; opacity: 0; } }
  .node:hover .zb { fill: var(--zoom); }
  .node:hover .zb-plus { stroke: var(--zoom-bg); }
  .zoom-key { display: inline-flex; align-items: center; gap: 6px; }
  .zoom-key i { width: 14px; height: 14px; border-radius: 50%; background: var(--zoom-bg); border: 1.2px solid var(--zoom); display: inline-block; position: relative; }
  .zoom-key i::before, .zoom-key i::after { content: ""; position: absolute; background: var(--zoom); left: 50%; top: 50%; transform: translate(-50%,-50%); }
  .zoom-key i::before { width: 8px; height: 1.6px; }
  .zoom-key i::after { width: 1.6px; height: 8px; }
  /* Tooltips: any element with data-tip. Dynamic-layer shapes opt back in to the pointer so they can be hovered. */
  #dyn [data-tip] { pointer-events: auto; cursor: help; }
  #tip { position: absolute; z-index: 10; display: none; max-width: 260px; padding: 8px 12px; font-size: 13px; line-height: 1.45;
         color: var(--text); background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius); box-shadow: var(--shadow-xl); pointer-events: none; }
</style>
</head>
<body>
<main id="app">
  <h1>Kafka, from the top down</h1>
  <p class="sub">Pick a view. Basics shows the core idea; System lets you zoom into the parts. <span class="zoom-key"><i aria-hidden="true"></i>A pulsing blue plus means you can click to zoom in.</span></p>

  <div id="views" class="bar"></div>
  <div class="bar">
    <div id="crumbs"></div>
    <button id="pause" class="spacer" data-tip="Stop or start the simulation. Stop it to look at one moment.">Pause</button>
    <button id="zout" data-tip="Go back one level. The Escape key also does this.">Zoom out</button>
  </div>

  <svg id="zv" viewBox="0 0 680 320" role="img" aria-label="Zoomable, animated diagram">
    <defs>
      <marker id="zarrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M2 1L8 5L2 9" fill="none" style="stroke: var(--muted)" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
      </marker>
    </defs>
    <!-- "cam" is the camera: zooming animates its transform. Static layer = clickable, dynamic layer = redrawn every frame. -->
    <g id="cam" style="transform-origin: 0 0">
      <g id="st"></g>
      <g id="dyn" style="pointer-events: none"></g>
    </g>
  </svg>

  <div id="controls"></div>
  <p class="hint">Hover over anything to see what it is. Zoom out with the breadcrumb, the button, Escape, or a trackpad pinch.</p>
  <section class="sources">
    <h2>Simplifications</h2>
    <p id="simpl"></p>
    <h2>Sources</h2>
    <ol id="srcs"></ol>
  </section>
  <div id="tip" role="tooltip"></div>
</main>

<script>
/* =====================================================================
   0. SHARED HELPERS (topic-agnostic)
   ===================================================================== */
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
const tip = s => ` data-tip="${esc(s)}"`;      // add a tooltip to any SVG or HTML element string
const T = (x, y, s, c = 'ts', a = 'middle', tipText) =>
  `<text class="${c}" x="${x}" y="${y}" text-anchor="${a}" dominant-baseline="central"${tipText ? tip(tipText) : ''}>${s}</text>`;
// Drill-in badge. Put it on the corner of every box that has data-go, and nowhere else.
const plus = (x, y) =>
  `<circle class="zb-ring" cx="${x}" cy="${y}" r="9"/><circle class="zb" cx="${x}" cy="${y}" r="9"/>` +
  `<path class="zb-plus" d="M${x - 4} ${y}h8M${x} ${y - 4}v8"/>`;
const ease = u => u < .5 ? 2 * u * u : 1 - Math.pow(-2 * u + 2, 2) / 2;
const dot = (x1, y1, x2, y2, u, r, fill) => {
  const k = ease(Math.min(u, 1));
  return `<circle cx="${x1 + (x2 - x1) * k}" cy="${y1 + (y2 - y1) * k}" r="${r}" fill="${fill}"/>`;
};
const round1 = v => Math.round(v * 10) / 10;

/* Color ramps: [50, 100, 200, 600, 800]. Light = 50 fill / 600 stroke / 800 title.
   Dark = 800 fill / 200 stroke / 100 title. Use class="c-<name>" on a <g> wrapping a rect + text.
   Legends use the same class on a swatch (<span class="sw c-<name>">), so a key always shows the
   color the marks have in the current mode. Never give a legend a hex color of its own. */
const RAMPS = {
  purple: ['#EEEDFE', '#CECBF6', '#AFA9EC', '#534AB7', '#3C3489'],
  teal:   ['#E1F5EE', '#9FE1CB', '#5DCAA5', '#0F6E56', '#085041'],
  coral:  ['#FAECE7', '#F5C4B3', '#F0997B', '#993C1D', '#712B13'],
  pink:   ['#FBEAF0', '#F4C0D1', '#ED93B1', '#993556', '#72243E'],
  amber:  ['#FAEEDA', '#FAC775', '#EF9F27', '#854F0B', '#633806'],
  gray:   ['#F5F5F5', '#E5E5E5', '#A1A1A1', '#737373', '#262626'],   // neutral, matches the page grays
};
(function injectRamps() {
  const rules = (pre, dark) => Object.entries(RAMPS).map(([n, [c50, c100, c200, c600, c800]]) => {
    const [fill, stroke, title, sub] = dark ? [c800, c200, c100, c200] : [c50, c600, c800, c600];
    return `${pre}.c-${n}>rect,${pre}.c-${n}>circle{fill:${fill};stroke:${stroke}}` +
           `${pre}.sw.c-${n}{background:${fill};border-color:${stroke}}` +
           `${pre}.c-${n}>.th,${pre}.c-${n}>.t{fill:${title}}${pre}.c-${n}>.ts{fill:${sub}}`;
  }).join('');
  const style = document.createElement('style');
  style.textContent = rules('', false) +
    `@media (prefers-color-scheme: dark){${rules(':root:not([data-theme="light"]) ', true)}}` +
    rules(':root[data-theme="dark"] ', true);
  document.head.append(style);
})();

/* =====================================================================
   1. TOPIC: STATE MODEL + SIMULATION  (replace for a new topic)
   ===================================================================== */
const KEYS = [   // message keys; hash(key) % partitions decides the partition
  { k: 'user-1', p: 0, hex: '#7F77DD', cls: 'c-purple' },
  { k: 'user-2', p: 1, hex: '#D85A30', cls: 'c-coral' },
  { k: 'user-3', p: 2, hex: '#D4537E', cls: 'c-pink' },
  { k: 'user-4', p: 0, hex: '#EF9F27', cls: 'c-amber' },
];
const CY = [70, 160, 250];         // vertical centers of the three partition lanes
const TEAL = '#1D9E75';            // consumer / reader color

const S = {                        // single source of truth: every scene draws from this
  parts: [0, 1, 2].map(() => ({ next: 0, cOff: 0, recs: [] })),   // next = log end offset, cOff = committed offset
  producers: 2, consumers: 3,
  rate: 0.6,                       // records per second, per producer
  cRate: 1,                        // records per second, per consumer
  paused: false, rebal: false, order: 100,
  ev: [],                          // short-lived animation events {t, ..., t0}
};
const emit = e => S.ev.push({ ...e, t0: performance.now() });
const owner = p => Math.floor(p * Math.min(S.consumers, 3) / 3);   // range assignor; 4th consumer goes idle
const lag = p => S.parts[p].next - S.parts[p].cOff;
const totalLag = () => lag(0) + lag(1) + lag(2);
const rec = (p, off) => S.parts[p].recs.find(r => r.off === off);

function land(p, ki) {
  const P = S.parts[p];
  P.recs.push({ off: P.next++, ki, val: 'order #' + (++S.order) });
  if (P.recs.length > 30) P.recs.shift();
}
function produce(ki = Math.floor(Math.random() * KEYS.length), pi = Math.floor(Math.random() * S.producers)) {
  const p = KEYS[ki].p;
  emit({ t: 'p', p, ki, pi });
  setTimeout(() => land(p, ki), 500);            // record is appended when the flying dot arrives
}
function consumeOne(p) {
  if (lag(p) <= 0) return;
  S.parts[p].cOff++;
  emit({ t: 'c', p });
}
function consumeTick() {
  if (S.rebal) return;                           // stop-the-world while the group rebalances
  for (let c = 0; c < S.consumers; c++) {
    const own = [0, 1, 2].filter(p => owner(p) === c && lag(p) > 0);
    if (own.length) consumeOne(own.reduce((a, b) => lag(b) > lag(a) ? b : a));
  }
}
function setConsumers(n) {
  if (n < 1 || n > 4 || S.rebal) return;
  S.consumers = n; S.rebal = true;
  setTimeout(() => { S.rebal = false; renderControls(); }, 1500);
}
// Loops re-read their delay every tick so slider changes apply immediately.
function loop(fn, delayMs) { (function run() { if (!S.paused) fn(); setTimeout(run, delayMs()); })(); }
loop(() => produce(), () => 1000 / (S.rate * S.producers));
loop(consumeTick, () => 1000 / S.cRate);
for (let i = 0; i < 12; i++) land(KEYS[i % 4].p, i % 4);          // seed so nothing starts empty
S.parts.forEach(P => P.cOff = Math.max(0, P.next - 2));

// Actions the controls can call: data-act="name" data-arg="number"
const ACT = {
  producers: d => { S.producers = Math.max(1, Math.min(4, S.producers + d)); },
  consumers: d => setConsumers(S.consumers + d),
  key:       i => produce(i),
  burst:     () => { for (let i = 0; i < 10; i++) setTimeout(() => produce(), i * 120); },
  produceTo: p => produce(KEYS.findIndex(k => k.p === p)),
  consumeOne: p => consumeOne(p),
};
// How slider values are displayed: data-set="key"
const FMT = { rate: v => round1(v) + '/s', cRate: v => round1(v) + '/s' };

/* =====================================================================
   2. TOPIC: SCENES (one per zoom level)  (replace for a new topic)
   Each scene: name, parent, rect (its box on the parent scene),
   st() static clickable SVG, dyn(now) per-frame SVG, controls() HTML.
   Tooltip text: short sentences, one idea each, active voice, plain words (STE style).
   ===================================================================== */
const evs = (t, dur, now) => S.ev.filter(e => e.t === t && now - e.t0 < dur).map(e => ({ ...e, u: (now - e.t0) / dur }));
const swatch = cls => `<span class="sw ${cls}"></span>`;   // legend chip; follows light/dark like the marks
const LAG_TIP = 'Lag is the number of records that wait to be read. Lag increases when records arrive faster than the consumer reads them.';

// Evidence for what this explainer teaches. Only list pages that were actually read.
const SOURCES = [
  { title: 'Apache Kafka 4.3 docs: Introduction', url: 'https://kafka.apache.org/43/getting-started/introduction/',
    supports: 'same key goes to the same partition; consumers read a partition in write order; events are not deleted after consumption; topics are spread over brokers' },
  { title: 'Apache Kafka 4.3 docs: Design', url: 'https://kafka.apache.org/43/design/design/',
    supports: 'each partition is consumed by exactly one consumer in a group; consumer position is one offset per partition; sequential offsets' },
  { title: 'Apache Kafka 4.3 docs: Broker configs', url: 'https://kafka.apache.org/43/configuration/broker-configs/',
    supports: 'log.retention.hours defaults to 168 (7 days)' },
  { title: 'Apache Kafka 4.3 docs: Consumer configs', url: 'https://kafka.apache.org/43/configuration/consumer-configs/',
    supports: 'classic default partition.assignment.strategy is RangeAssignor, then CooperativeStickyAssignor' },
  { title: 'KIP-429: Kafka Consumer Incremental Rebalance Protocol', url: 'https://cwiki.apache.org/confluence/display/KAFKA/KIP-429%3A+Kafka+Consumer+Incremental+Rebalance+Protocol',
    supports: 'the eager protocol revokes all partitions during a rebalance ("stop-the-world")' },
  { title: 'Apache Kafka 4.3 docs: Consumer rebalance protocol', url: 'https://kafka.apache.org/43/operations/consumer-rebalance-protocol/',
    supports: 'the incremental protocol (KIP-848) is GA from Kafka 4.0 and has no global synchronization barrier' },
  { title: 'Conduktor: Kafka consumer groups and offsets (secondary source)', url: 'https://www.conduktor.io/kafka/kafka-consumer-groups-and-consumer-offsets',
    supports: 'more consumers than partitions leaves some consumers idle' },
  { title: 'RabbitMQ docs: Consumer acknowledgements and publisher confirms', url: 'https://www.rabbitmq.com/docs/confirms',
    supports: 'a queue discards a message after a positive acknowledgement' },
];
const SIMPLIFICATIONS = 'The simulation uses one topic with 3 partitions, fast time, and shows only the last few records. ' +
  'Kafka picks a partition by hashing the key; the key-to-partition mapping here is illustrative. ' +
  'The consumer group behaves like the classic eager protocol, where a rebalance pauses all reading. ' +
  'Kafka 4.0 and later also offer an incremental protocol (KIP-848) that avoids this global pause. ' +
  'Replication, brokers and commits to Kafka are not shown.';

// Entry views: different ways to look at the same model. Each key is a root scene (no parent).
// Put the fundamentals view first; it is what the learner sees on load.
const VIEWS = [
  { key: 'basics', label: 'Basics: queue vs log', tip: 'The core idea in one picture. Start here.' },
  { key: 'overview', label: 'System: flow and zoom', tip: 'The whole system. Click the parts to see more detail.' },
];

const SC = {
  basics: {
    name: 'Basics',
    st: () => `
      <g${tip('A traditional queue, for example RabbitMQ. A message leaves the queue after the consumer reads it and confirms it. This confirmation is called an acknowledgement.')}>
        <rect class="box" x="20" y="20" width="310" height="260" rx="12" stroke-width="0.5"/>
        ${T(175, 44, 'Traditional queue', 'th')}${T(175, 62, 'Read and acknowledge removes it')}</g>
      <g${tip('Kafka stores messages in a log. Reading does not delete a message. Kafka deletes old messages only when the retention time ends.')}>
        <rect class="box" x="350" y="20" width="310" height="260" rx="12" stroke-width="0.5"/>
        ${T(505, 44, 'Kafka log', 'th')}${T(505, 62, 'Reading moves an offset')}</g>
      <g class="c-teal"${tip('The consumer takes the first message and acknowledges it. The queue then deletes it. Another app cannot read it again.')}>
        <rect x="115" y="170" width="120" height="40" rx="8" stroke-width="0.5"/>${T(175, 190, 'Consumer', 'th')}</g>
      <g class="c-teal"${tip('The consumer remembers its position, called the offset. Another consumer group can read the same records from its own position.')}>
        <rect x="435" y="170" width="140" height="40" rx="8" stroke-width="0.5"/>${T(505, 190, 'Consumer', 'th')}</g>
      ${T(175, 240, 'Once acknowledged, the message is gone.')}
      ${T(505, 240, 'Read records stay.')}${T(505, 258, 'Many groups can read them.')}
      ${T(340, 302, 'Both sides show the same records, from partition P0.')}`,
    dyn: now => {
      const P = S.parts[0];
      let s = '';
      const queue = P.recs.filter(r => r.off >= P.cOff).slice(0, 9);
      queue.forEach((r, i) => {
        const x = 40 + i * 30;
        s += `<g class="${KEYS[r.ki].cls}"${tip(`Message ${r.off} waits in the queue. When the consumer reads it, the queue deletes it.`)}><rect x="${x}" y="100" width="26" height="30" rx="4" stroke-width="0.5"/>${T(x + 13, 115, r.off)}</g>`;
      });
      const st = Math.max(0, P.next - 9);
      P.recs.filter(r => r.off >= st).forEach(r => {
        const x = 370 + (r.off - st) * 30, read = r.off < P.cOff;
        s += `<g class="${KEYS[r.ki].cls}" opacity="${read ? .4 : 1}"${tip(`Record at offset ${r.off}. ` + (read ? 'The consumer read it. Kafka keeps it.' : 'It waits for the consumer.'))}><rect x="${x}" y="100" width="26" height="30" rx="4" stroke-width="0.5"/>${T(x + 13, 115, r.off)}</g>`;
      });
      const px = 370 + Math.min(Math.max(P.cOff - st, 0), 9) * 30 + 13;
      s += `<polygon points="${px},136 ${px - 6},146 ${px + 6},146" fill="${TEAL}"${tip(`The consumer offset is ${P.cOff}. The consumer reads this record next.`)}/>`;
      evs('p', 500, now).filter(e => e.p === 0).forEach(e => {
        s += dot(30, 115, 40 + Math.min(queue.length, 8) * 30 + 13, 115, e.u, 6, KEYS[e.ki].hex);
        s += dot(360, 115, 370 + Math.min(P.next - st, 8) * 30 + 13, 115, e.u, 6, KEYS[e.ki].hex);
      });
      evs('c', 450, now).filter(e => e.p === 0).forEach(e => {
        s += dot(53, 115, 175, 170, e.u, 5, TEAL);
        s += dot(Math.max(px - 30, 383), 115, 505, 170, e.u, 5, TEAL);
      });
      return s;
    },
    controls: () =>
      C.button('Send one record', 'produceTo', 0, 'Send one record to P0. Look at both sides.') +
      C.button('Read one record', 'consumeOne', 0, 'Read one record. The queue deletes it. The log keeps it and moves the offset.') +
      `<span>Pause first to compare one step at a time.</span>`,
  },

  overview: {
    name: 'System',
    st: () => `
      <g class="c-purple"${tip('Producers are apps that send records to Kafka. A record is one message, for example one order.')}>
        <rect x="30" y="130" width="130" height="60" rx="8" stroke-width="0.5"/>${T(95, 150, 'Producers', 'th')}</g>
      <line class="leader" x1="164" y1="160" x2="226" y2="160"/>
      <g class="node" data-go="topic"${tip('The Kafka cluster stores the records. Records stay after apps read them. Click to zoom in.')}>
        <g class="c-gray"><rect x="230" y="80" width="220" height="160" rx="12" stroke-width="0.5"/>
          ${T(340, 102, 'Kafka cluster', 'th')}${T(340, 120, 'Topic: orders')}
          ${[0, 1, 2].map(p => `<rect x="248" y="${137 + p * 22}" width="184" height="16" rx="3" stroke-width="0.5"/>`).join('')}
        </g>${plus(450, 80)}
      </g>
      <line class="leader" x1="454" y1="160" x2="511" y2="160"/>
      <g class="node" data-go="group"${tip('A consumer group is a team of apps that read the records. Kafka divides the work among the members. Click to zoom in.')}>
        <g class="c-teal"><rect x="515" y="130" width="140" height="60" rx="8" stroke-width="0.5"/>${T(585, 150, 'Consumer group', 'th')}</g>${plus(655, 130)}
      </g>`,
    dyn: now => {
      let s = '';
      [0, 1, 2].forEach(p => {
        const P = S.parts[p], st = Math.max(0, P.next - 12);
        P.recs.filter(r => r.off >= st).forEach(r => {
          s += `<rect x="${251 + (r.off - st) * 15}" y="${140 + p * 22}" width="12" height="10" rx="2" fill="${KEYS[r.ki].hex}" opacity="${r.off < P.cOff ? .35 : 1}"/>`;
        });
      });
      const tot = S.parts.reduce((a, P) => a + P.next, 0);
      s += `<g class="c-purple">${T(95, 170, S.producers + ' running')}</g>`;
      s += `<g class="c-gray">${T(340, 220, tot + ' records stored')}</g>`;
      s += `<g class="c-teal">${T(585, 170, S.rebal ? 'rebalancing…' : S.consumers + ' members · lag ' + totalLag(), 'ts', 'middle', LAG_TIP)}</g>`;
      evs('p', 500, now).forEach(e => {
        const P = S.parts[e.p], st = Math.max(0, P.next - 12);
        s += dot(160, 160, 251 + Math.min(P.next - st, 11) * 15 + 6, 145 + e.p * 22, e.u, 5, KEYS[e.ki].hex);
      });
      evs('c', 450, now).forEach(e => { s += dot(450, 160, 515, 160, e.u, 4, TEAL); });
      return s;
    },
    controls: () =>
      C.slider('Produce rate per producer', 'rate', 0.2, 3, 0.2, 'The number of records that each producer sends per second.') +
      C.slider('Consume rate per consumer', 'cRate', 0.2, 3, 0.2, 'The number of records that each consumer reads per second.'),
  },

  topic: {
    name: 'Kafka cluster', parent: 'overview', rect: { x: 230, y: 80, w: 220, h: 160 },
    st: () => `
      ${T(140, 24, 'Topic: orders, 3 partitions', 'ts', 'start', 'A topic is a named stream of records. Kafka divides a topic into partitions. The partitions sit on different brokers.')}
      ${T(560, 24, 'Lag', 'ts', 'start', LAG_TIP)}
      ${CY.map((cy, p) => `<g class="node" data-go="part:${p}"${tip(`Partition P${p}. Kafka adds each new record to the end of this list. It does not change old records. Click to zoom in.`)}>
        <rect class="box" x="140" y="${cy - 24}" width="400" height="48" rx="8" stroke-width="0.5"/>${T(160, cy, 'P' + p, 'th')}${plus(540, cy - 24)}</g>`).join('')}`,
    dyn: now => {
      let s = '';
      const n = S.producers, pcy = i => 160 + (i - (n - 1) / 2) * 48;
      for (let i = 0; i < n; i++) {
        s += `<g class="c-purple"${tip(`Producer ${i + 1} sends records. The key of each record selects the partition. Records with the same key always go to the same partition, in order.`)}>` +
             `<rect x="15" y="${pcy(i) - 17}" width="100" height="34" rx="8" stroke-width="0.5"/>${T(65, pcy(i), 'Producer ' + (i + 1), 'th')}</g>`;
      }
      CY.forEach((cy, p) => {
        const P = S.parts[p], st = Math.max(0, P.next - 10);
        P.recs.filter(r => r.off >= st).forEach(r => {
          const x = 180 + (r.off - st) * 34, read = r.off < P.cOff;
          const t = `Record at offset ${r.off}, key ${KEYS[r.ki].k}. ` + (read ? 'The consumer read it. Kafka keeps it.' : 'It waits for the consumer.');
          s += `<g class="${KEYS[r.ki].cls}" opacity="${read ? .4 : 1}"${tip(t)}><rect x="${x}" y="${cy - 15}" width="30" height="30" rx="4" stroke-width="0.5"/>${T(x + 15, cy, r.off)}</g>`;
        });
        const px = 180 + Math.min(Math.max(P.cOff - st, 0), 10) * 34 + 15;
        s += `<polygon points="${px},${cy + 27} ${px - 6},${cy + 36} ${px + 6},${cy + 36}" fill="${TEAL}"${tip(`The consumer reads offset ${P.cOff} next.`)}/>`;
        s += T(560, cy, lag(p), 'th', 'start', `${lag(p)} records in P${p} wait for the consumer.`);
      });
      evs('p', 500, now).forEach(e => {
        const P = S.parts[e.p], st = Math.max(0, P.next - 10);
        s += dot(115, pcy(Math.min(e.pi, n - 1)), 180 + Math.min(P.next - st, 9) * 34 + 15, CY[e.p], e.u, 6, KEYS[e.ki].hex);
      });
      evs('c', 450, now).forEach(e => {
        const P = S.parts[e.p], st = Math.max(0, P.next - 10), px = 180 + Math.min(Math.max(P.cOff - 1 - st, 0), 9) * 34 + 15;
        s += dot(px, CY[e.p], 670, CY[e.p], e.u, 4, TEAL);
      });
      return s;
    },
    controls: () =>
      C.stepper('Producers', 'producers', 'producers', 'Add or remove producers. More producers send more records.') +
      `<span class="grp"${tip('Send one record with this key. Look at the partition that it goes to.')}>Send key ${KEYS.map((k, i) => C.button(swatch(k.cls) + k.k, 'key', i)).join('')}</span>` +
      C.button('Burst 10', 'burst', '', 'Send 10 records quickly. Look at the lag increase.'),
  },

  part: {
    name: p => 'Partition P' + p, parent: 'topic', rect: p => ({ x: 140, y: CY[p] - 24, w: 400, h: 48 }),
    st: p => `
      ${T(40, 28, 'Partition P' + p + ' of topic orders', 'th', 'start')}
      ${T(40, 50, 'An append-only log. Reading moves the offset; it never deletes.', 'ts', 'start', 'Append-only means that Kafka only adds records to the end. Reading a record does not remove it.')}`,
    dyn: (now, p) => {
      const P = S.parts[p], base = P.next - 5;
      let s = '';
      for (let i = 0; i < 5; i++) {
        const off = base + i, r = off >= 0 && rec(p, off);
        if (!r) continue;
        const read = off < P.cOff, x = 40 + i * 102, cx = x + 46;
        const t = `Offset ${off} is the position of this record in the log. The offset does not change. ` +
                  (read ? 'The consumer read this record. Kafka keeps it until the retention time ends. The default is 7 days.' : 'The consumer did not read this record yet.');
        s += `<g class="${read ? 'c-gray' : KEYS[r.ki].cls}"${tip(t)}><rect x="${x}" y="80" width="92" height="110" rx="8" stroke-width="0.5"/>` +
             `${T(cx, 102, 'offset ' + off, 'th')}${T(cx, 128, KEYS[r.ki].k)}${T(cx, 148, r.val)}${T(cx, 172, read ? 'read' : 'unread')}</g>`;
      }
      s += `<rect class="box" x="550" y="80" width="92" height="110" rx="8" stroke-width="0.5" stroke-dasharray="4 4"${tip(`Kafka writes the next record here, at offset ${P.next}. This position is the log end offset.`)}/>` +
           `${T(596, 122, 'offset ' + P.next)}${T(596, 142, 'next write')}${T(596, 68, 'log end')}`;
      const behind = P.cOff < base, ci = Math.max(0, P.cOff - base), px = 40 + ci * 102 + 46;
      const ptrTip = `Consumer offset ${P.cOff}. The consumer group saves this number. After a restart, reading continues from here.`;
      s += `<polygon points="${px},198 ${px - 7},210 ${px + 7},210" fill="${TEAL}"${tip(ptrTip)}/>${T(px, 226, behind ? 'consumer, further back' : 'consumer offset', 'ts', 'middle', ptrTip)}`;
      s += T(40, 268, 'Log end offset: ' + P.next, 't', 'start', 'The offset that Kafka gives to the next record.') +
           T(250, 268, 'Consumer offset: ' + P.cOff, 't', 'start', ptrTip) +
           T(480, 268, 'Lag: ' + lag(p), 'th', 'start', LAG_TIP);
      s += T(40, 296, 'lag = log end offset − consumer offset', 'ts', 'start', LAG_TIP);
      evs('p', 500, now).filter(e => e.p === p).forEach(e => { s += dot(596, 0, 596, 135, e.u, 7, KEYS[e.ki].hex); });
      return s;
    },
    controls: p =>
      C.button('Produce one', 'produceTo', p, 'Send one record to this partition.') +
      C.button('Consume one', 'consumeOne', p, 'Read one record. The consumer offset moves forward by one. The record stays in the log.') +
      `<span>Pause first to step one event at a time.</span>`,
  },

  group: {
    name: 'Consumer group', parent: 'overview', rect: { x: 515, y: 130, w: 140, h: 60 },
    st: () => `
      ${T(40, 24, 'Consumer group: billing', 'ts', 'start', 'All consumers in this group share one job: they read the topic together. Each record goes to one member only.')}
      ${CY.map((cy, p) => `<g${tip(`Partition P${p}. The lag shows how many records wait.`)}><rect class="box" x="40" y="${cy - 24}" width="110" height="48" rx="8" stroke-width="0.5"/>${T(95, cy - 9, 'P' + p, 'th')}</g>`).join('')}`,
    dyn: now => {
      let s = '';
      const n = S.consumers, ccy = c => 160 + (c - (n - 1) / 2) * 72;
      CY.forEach((cy, p) => {
        s += T(95, cy + 11, 'lag ' + lag(p));
        if (!S.rebal) s += `<line class="arr" x1="154" y1="${cy}" x2="434" y2="${ccy(owner(p))}" marker-end="url(#zarrow)"/>`;
      });
      const rebalTip = 'The group is rebalancing. Kafka gives the partitions to the members again. With the classic protocol, all reading stops for a short time.';
      for (let c = 0; c < n; c++) {
        const own = [0, 1, 2].filter(p => owner(p) === c), y = ccy(c), list = own.map(p => 'P' + p).join(', ');
        const sub = S.rebal ? 'waiting…' : own.length ? 'reads ' + list : 'idle, no partition left';
        const t = S.rebal ? rebalTip : own.length
          ? `Consumer ${c + 1} reads ${list}. Only one member of the group reads each partition. This keeps the records of each key in order.`
          : `Consumer ${c + 1} has no work. The topic has 3 partitions, so a 4th consumer waits. If a consumer leaves, a rebalance can give its partition to this one.`;
        s += `<g class="${own.length ? 'c-teal' : 'c-gray'}"${tip(t)}><rect x="440" y="${y - 25}" width="190" height="50" rx="8" stroke-width="0.5"/>${T(535, y - 9, 'Consumer ' + (c + 1), 'th')}${T(535, y + 11, sub)}</g>`;
      }
      if (S.rebal) s += T(295, 160, 'Rebalancing…', 'th', 'middle', rebalTip);
      evs('c', 450, now).forEach(e => { if (!S.rebal) s += dot(154, CY[e.p], 434, ccy(owner(e.p)), e.u, 4, TEAL); });
      return s;
    },
    controls: () =>
      C.stepper('Consumers', 'consumers', 'consumers', 'Add or remove consumers. Each change starts a rebalance.') +
      C.slider('Consume rate per consumer', 'cRate', 0.2, 3, 0.2, 'The number of records that each consumer reads per second.'),
  },
};

/* =====================================================================
   3. ENGINE: camera, breadcrumb, controls, tooltips, input  (topic-agnostic)
   ===================================================================== */
const fmt = key => (FMT[key] || (v => v))(S[key]);
const tipAttr = t => t ? tip(t) : '';
const C = {   // control builders used by scene.controls(); the last argument is the tooltip text
  stepper: (label, key, act, t) =>
    `<span class="grp"${tipAttr(t)}>${label}<button data-act="${act}" data-arg="-1" aria-label="Fewer">−</button><span class="val">${S[key]}</span><button data-act="${act}" data-arg="1" aria-label="More">+</button></span>`,
  slider: (label, key, min, max, step, t) =>
    `<label class="grp"${tipAttr(t)}>${label}<input type="range" data-set="${key}" min="${min}" max="${max}" step="${step}" value="${S[key]}"><span class="val" data-show="${key}">${fmt(key)}</span></label>`,
  button: (label, act, arg = '', t) => `<button data-act="${act}" data-arg="${arg}"${tipAttr(t)}>${label}</button>`,
};

let cur = VIEWS[0].key, busy = false;
const kind = k => k.split(':')[0], arg = k => +k.split(':')[1];
const val = (v, k) => typeof v === 'function' ? v(arg(k)) : v;
const parentOf = k => SC[kind(k)].parent;
const rootOf = k => { while (parentOf(k)) k = parentOf(k); return k; };
const rectOf = k => val(SC[kind(k)].rect, k);
const nameOf = k => val(SC[kind(k)].name, k);
const cam = $('cam');

// Camera transforms: "fit" flies into box r; "inset" shrinks the whole view into box r.
const fit = r => { const s = Math.min(680 / r.w, 320 / r.h); return `translate(${340 - s * (r.x + r.w / 2)}px,${160 - s * (r.y + r.h / 2)}px) scale(${s})`; };
const inset = r => { const s = Math.min(r.w / 680, r.h / 320); return `translate(${r.x + r.w / 2 - s * 340}px,${r.y + r.h / 2 - s * 160}px) scale(${s})`; };

function renderControls() {
  const c = SC[kind(cur)].controls;
  $('controls').innerHTML = c ? c(arg(cur)) : '';
}
function build() {
  $('views').innerHTML = VIEWS.map(v =>
    `<button class="vbtn${rootOf(cur) === v.key ? ' active' : ''}" data-view="${v.key}"${tipAttr(v.tip)}>${v.label}</button>`).join('');
  $('st').innerHTML = val(SC[kind(cur)].st, cur);
  const path = [];
  for (let k = cur; k; k = parentOf(k)) path.unshift(k);
  $('crumbs').innerHTML = path.length < 2 ? '' : path.map((k, i) => i < path.length - 1
    ? `<button class="crumb" data-crumb="${k}">${nameOf(k)}</button><span class="sep">›</span>`
    : `<span class="here">${nameOf(k)}</span>`).join('');
  $('zout').style.visibility = parentOf(cur) ? 'visible' : 'hidden';
  renderControls();
}
// Switching between views is a crossfade; zoom animation is only for moving inside one view.
function switchView(to) {
  busy = true; hideTip();
  cam.style.transition = 'opacity .25s ease-in';
  cam.style.opacity = 0;
  setTimeout(() => {
    cur = to; build();
    cam.style.transition = 'none';
    cam.style.transform = 'translate(0px,0px) scale(1)';
    cam.getBoundingClientRect();
    requestAnimationFrame(() => {
      cam.style.transition = 'opacity .3s ease-out';
      cam.style.opacity = 1;
      setTimeout(() => busy = false, 320);
    });
  }, 250);
}
function go(to) {
  if (busy || to === cur) return;
  if (rootOf(to) !== rootOf(cur)) return switchView(to);
  hideTip();
  const inward = parentOf(to) === cur;
  let r;
  if (inward) r = rectOf(to);
  else { let k = cur; while (parentOf(k) !== to) k = parentOf(k); r = rectOf(k); }
  busy = true;
  cam.style.transition = 'transform .35s ease-in, opacity .35s ease-in';
  cam.style.transform = inward ? fit(r) : inset(r);
  cam.style.opacity = 0;
  setTimeout(() => {
    cur = to; build();
    cam.style.transition = 'none';
    cam.style.transform = inward ? inset(r) : fit(r);
    cam.getBoundingClientRect();   // force reflow so the next transition starts from here
    requestAnimationFrame(() => {
      cam.style.transition = 'transform .45s ease-out, opacity .45s ease-out';
      cam.style.transform = 'translate(0px,0px) scale(1)';
      cam.style.opacity = 1;
      setTimeout(() => busy = false, 500);
    });
  }, 350);
}
const zoomOut = () => { const p = parentOf(cur); if (p) go(p); };
// Find the zoom target under a point, even when a hoverable dynamic shape sits on top of it.
const goTargetAt = (x, y) => document.elementsFromPoint(x, y).map(el => el.closest && el.closest('[data-go]')).find(Boolean);

// Tooltips: positioned inside #app (position: relative), so this also works inside an iframe widget.
const tipEl = $('tip'), app = $('app');
function showTip(text, cx, cy) {
  tipEl.textContent = text;
  tipEl.style.display = 'block';
  const a = app.getBoundingClientRect(), w = tipEl.offsetWidth, h = tipEl.offsetHeight;
  let left = cx - a.left + 14, top = cy - a.top + 18;
  if (left + w > a.width - 8) left = Math.max(8, cx - a.left - w - 14);
  if (cy + 18 + h > window.innerHeight) top = cy - a.top - h - 12;
  tipEl.style.left = left + 'px';
  tipEl.style.top = top + 'px';
}
function hideTip() { tipEl.style.display = 'none'; }
document.addEventListener('mousemove', e => {
  const el = e.target.closest && e.target.closest('[data-tip]');
  if (el) showTip(el.dataset.tip, e.clientX, e.clientY); else hideTip();
});
document.addEventListener('focusin', e => {
  const el = e.target.closest('[data-tip]');
  if (el) { const r = el.getBoundingClientRect(); showTip(el.dataset.tip, r.left, r.bottom); }
});
document.addEventListener('focusout', hideTip);

$('zv').addEventListener('click', e => { const t = goTargetAt(e.clientX, e.clientY); if (t) go(t.dataset.go); });
$('crumbs').addEventListener('click', e => { const b = e.target.closest('[data-crumb]'); if (b) go(b.dataset.crumb); });
$('views').addEventListener('click', e => { const b = e.target.closest('[data-view]'); if (b) go(b.dataset.view); });
$('zout').onclick = zoomOut;
document.addEventListener('keydown', e => { if (e.key === 'Escape') { hideTip(); zoomOut(); } });
$('pause').onclick = () => { S.paused = !S.paused; $('pause').textContent = S.paused ? 'Play' : 'Pause'; };

// Trackpad pinch arrives as wheel + ctrlKey. Plain scrolling is left alone.
let lastWheel = 0;
$('zv').addEventListener('wheel', e => {
  if (!e.ctrlKey) return;
  e.preventDefault();
  const now = performance.now();
  if (busy || now - lastWheel < 700) return;
  if (e.deltaY < 0) { const t = goTargetAt(e.clientX, e.clientY); if (t) { lastWheel = now; go(t.dataset.go); } }
  else if (e.deltaY > 0 && parentOf(cur)) { lastWheel = now; zoomOut(); }
}, { passive: false });

$('controls').addEventListener('click', e => {
  const b = e.target.closest('[data-act]');
  if (!b) return;
  ACT[b.dataset.act](b.dataset.arg === '' ? undefined : Number(b.dataset.arg));
  renderControls();
});
$('controls').addEventListener('input', e => {
  const key = e.target.dataset.set;
  if (!key) return;
  S[key] = +e.target.value;
  document.querySelectorAll(`[data-show="${key}"]`).forEach(el => el.textContent = fmt(key));
});

function frame(now) {
  S.ev = S.ev.filter(e => now - e.t0 < 1000);
  $('dyn').innerHTML = SC[kind(cur)].dyn(now, arg(cur));
  requestAnimationFrame(frame);
}
$('simpl').textContent = SIMPLIFICATIONS;
$('srcs').innerHTML = SOURCES.map(x =>
  `<li><a href="${esc(x.url)}" target="_blank" rel="noopener">${esc(x.title)}</a>: ${esc(x.supports)}</li>`).join('');
build();
requestAnimationFrame(frame);
</script>
</body>
</html>
